[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "meckel-ai"
version = "0.1.0"
description = "AI-assisted dental radiograph analysis copilot"
requires-python = ">=3.10"
dependencies = [
    "pyyaml>=6.0.1",
    "pillow>=10.3.0",
]

[project.optional-dependencies]
train = [
    "ultralytics>=8.2.0",
    "opencv-python>=4.9.0",
    "matplotlib>=3.8.0",
]

[tool.setuptools.packages.find]
include = ["meckel*"]